openapi: 3.1.0
info:
  title: 国立国会図書館サーチ OpenSearch（よむまが使う GET の1つだけ）
  version: 1.0.0
  summary: 書誌の問い合わせ（ISBN で引く形と、書名で探す形）。相手は国立国会図書館の外部 API で、アプリはここに書いた形だけを送る。
  description: |
    - 何の契約か：001-reading-session（よむま v1）の書誌の問い合わせ。決めたことは docs/adr/0004-bibliographic-lookup.md。
      相手の API の一部を、アプリが送る形と読む要素に絞って写したもの。相手の仕様を変えるものではない。
    - 相手の仕様：国立国会図書館サーチ 外部提供インタフェース仕様書（第1.5版、2026-09-25）の「4. OpenSearch」
      https://ndlsearch.ndl.go.jp/file/help/api/specifications/ndlsearch_api_20260925.pdf
    - 実際に問い合わせて確かめた日：2026-10-20（G1 の 7-2。docs/adr/features/001-reading-session-ndl-check.md の「結果」）。
    - iOS では Swift OpenAPI Generator でクライアントを作らない。応答が XML で、外部のライブラリを入れない（ADR 0001）ため。
      送る URL の形と要素の読み方は、単体テストと、つなぎ口 H20（書誌の応答の差し替え）で、この契約の examples に合わせる。
    - 書誌のメタデータの条件：国立国会図書館が作成し提供する書誌データで、二次利用条件は CC BY 4.0 と互換
      （データプロバイダ一覧 https://ndlsearch.ndl.go.jp/help/api/provider の注 (1)）。アプリに出すクレジットの文は ADR 0004（AC-93）。
  contact:
    name: 国立国会図書館サーチ API のヘルプ（17. API のご利用について）
    url: https://ndlsearch.ndl.go.jp/help/api
  license:
    name: CC BY 4.0（国立国会図書館が作成し提供する書誌データの二次利用条件と互換）
    url: https://creativecommons.org/licenses/by/4.0/
servers:
  - url: https://ndlsearch.ndl.go.jp
    description: 国立国会図書館サーチ（本番だけ）。アプリはこのホストのほかには通信しない（AC-103）。
tags:
  - name: bibliographic
    description: 書誌の問い合わせ（ADR 0004）
paths:
  /api/opensearch:
    get:
      operationId: ndlOpenSearch
      tags:
        - bibliographic
      summary: ISBN か書名で、国立国会図書館の CC BY の書誌（蔵書と新着書誌情報）を探す
      description: |
        AC：AC-2〜AC-6、AC-9〜AC-11、AC-92、AC-103、AC-113（どれも H20 で応答を差し替えて確かめる。AC-6 は通信がないので送らないことを見る）。対応は設計メモの 2 の表を正とする。

        認証：不要（下の security は空）。クッキー、キャッシュ、利用者や端末の ID は送らない（ADR 0004）。

        アプリが送る形は次の2つだけ。ほかの引数と組み合わせは送らない。
        1. ISBN で引く（登録、順番待ち、問い合わせ直し）：`dpid=iss-ndl-opac%20iss-ndl-opac-inprocess&isbn=<13桁の ISBN>`。cnt は付けない（相手の既定は200件まで。13桁なら完全一致）。
        2. 書名で探す（AC-4、AC-5）：`dpid=iss-ndl-opac%20iss-ndl-opac-inprocess&title=<入れた書名>&cnt=200`。

        相手の決まりで、アプリが守ること（仕様書の表 4-1 の注と (4)、API のヘルプの 17-4 (1)）。
        - dpid は半角空白区切りで2つ（OR になる）。dpid だけの問い合わせはできない（0件になる）。
        - 引数の誤りは、エラーでなく HTTP 200 の0件として返る（下の例 paramError）。だから0件は「見つからない」（AC-10）と読み、URL の形は単体テストで固定する。
        - cnt の上限は500。501件目から後ろは取れない。
        - 問い合わせは1件ずつ送る（前の応答か失敗を待ってから次を送る）。同時に2件以上は送らない。

        待つのは30秒まで。応答が2 MB を超えたら読むのをやめて失敗とする（ADR 0004）。
      security: []
      parameters:
        - name: dpid
          in: query
          required: true
          description: データプロバイダ ID を半角空白区切りで2つ。国立国会図書館蔵書（iss-ndl-opac）と国立国会図書館新着書誌情報（iss-ndl-opac-inprocess）。URL の中では空白を %20 にする。
          schema:
            type: string
            const: iss-ndl-opac iss-ndl-opac-inprocess
          example: iss-ndl-opac iss-ndl-opac-inprocess
        - name: isbn
          in: query
          required: false
          description: ISBN で引く形だけで使う。ハイフンなしの13桁。title と一緒には送らない。
          schema:
            type: string
            pattern: '^97[89][0-9]{10}$'
          example: '9784101006055'
        - name: title
          in: query
          required: false
          description: 書名で探す形だけで使う。利用者が入れた書名の前後の空白を除いたもの（1〜100字）。相手の側では部分一致で、空白で区切った語は AND になる。isbn と一緒には送らない。
          schema:
            type: string
            minLength: 1
            maxLength: 100
          example: 人間失格
        - name: cnt
          in: query
          required: false
          description: 書名で探す形だけで付け、値は200（1回だけ問い合わせ、ページ送りはしない。ADR 0004）。ISBN で引く形では付けない。
          schema:
            type: integer
            const: 200
          example: 200
      responses:
        '200':
          description: |
            RSS 2.0 を国立国会図書館サーチ用に広げた XML。実際の Content-Type は `text/xml;charset=UTF-8`（2026-10-20 の問い合わせのすべてで同じ）。アプリは application/xml と text/xml のどちらも受け付ける。

            0件のときも HTTP 200 で、`channel` に `item` がない（`openSearch:totalResults` は0）。

            要素の対応表（`item` の子。接頭辞は応答のとおり。dc＝http://purl.org/dc/elements/1.1/ 、dcndl＝http://ndl.go.jp/dcndl/terms/ 、dcterms＝http://purl.org/dc/terms/ 、xsi＝http://www.w3.org/2001/XMLSchema-instance ）

            | アプリの項目（設計メモの 5 の Book） | 読む要素 | 決まり |
            |---|---|---|
            | 使う item | `item` | ISBN で引く形：下の isbn の行で直した値が、問い合わせた ISBN と同じ最初の item。なければ「見つからない」（AC-10）。書名で探す形：ISBN のある item だけを、同じ ISBN の2つ目から後ろを除いて使う（並べ方は ADR 0004） |
            | title（書名） | `dc:title`。`dcndl:volume` があれば、半角空白と1つ目の値を後ろに足す | 前後の空白を除く。100字を超えたら101字目から後ろを捨てる。空なら書誌は「そろわない」 |
            | author（著者） | `dc:creator` の1つ目。なければ `author` | PRD の 11 の冒頭の決まり（AC-92）で取り出す。100字を超えたら101字目から後ろを捨てる |
            | publisher（出版社） | `dc:publisher` の1つ目 | 前後の空白を除く。2つ目から後ろ（発売元など）は使わない |
            | label（レーベル） | `dcndl:seriesTitle` の1つ目 | 「 ; 」より前だけを使う（例「幻冬舎新書 ; ひ-2-3」→「幻冬舎新書」） |
            | publishedYear（出版年） | `dcterms:issued` | 頭の4桁の数字（例「2006.1」→2006）。4桁の数字で始まらなければ空 |
            | isbn | `dc:identifier` のうち `xsi:type` が `dcndl:ISBN` か `dcndl:ISBN13` のもの | 数字と X だけにし、10桁なら13桁に直す（例「4-10-100605-9」→9784101006055。実際の応答で13桁の本にも10桁の値が入っていた） |
            | （読まない） | `title`、`description`（HTML を含む）、`link`、`guid`、`category`、`rdfs:seeAlso`、`dcndl:price` ほか | 保存も表示もしない |
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/OpenSearchRss'
              examples:
                isbnFound:
                  $ref: '#/components/examples/IsbnFound'
                notFound:
                  $ref: '#/components/examples/NotFound'
                paramError:
                  $ref: '#/components/examples/ParamError'
            text/xml:
              schema:
                $ref: '#/components/schemas/OpenSearchRss'
              examples:
                isbnFound:
                  $ref: '#/components/examples/IsbnFound'
                notFound:
                  $ref: '#/components/examples/NotFound'
                paramError:
                  $ref: '#/components/examples/ParamError'
        default:
          description: |
            HTTP 200 のほかの応答。形は相手の仕様書に書かれておらず、2026-10-20 の問い合わせでも出なかった（未確認）。
            アプリは状態コードだけを見て「失敗」（AC-11）とし、本文は読まない。通信の失敗、30秒の打ち切り、2 MB を超えた応答、XML として読めない応答も同じく「失敗」。失敗した本は順番待ちに残す（ADR 0004）。
components:
  schemas:
    OpenSearchRss:
      type: string
      description: RSS 2.0 の XML 文書。JSON Schema では中の形を書けないので、読む要素は 200 の応答の対応表に書いた。
  examples:
    IsbnFound:
      summary: ISBN で引いて1件（2026-10-20 01:48 の実際の応答。rdfs:seeAlso の行の多くを略した）
