# XcodeGen 2.46.0 の project spec（docs/adr/0004-project-generation-xcodegen.md）。書く役：ios-engineer。
# 作ったプロジェクト（Yomutoki.xcodeproj）はコミットしない。name は変えない（xctestplan のターゲットの ID がこの名前から作られる。設計メモ 11 の 13）。
# 受け入れテストのターゲットと、その計画の定義は verifier のファイルにあり、下の include の1行だけで読む。
include: [AcceptanceTests/target.yml]

name: Yomutoki

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  developmentLanguage: ja
  createIntermediateGroups: true
  # 設計メモ 11 の雛形の作り方：テスト計画のファイルがまだない間も generate できるようにする。
  disabledValidations:
    - missingTestPlans

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  Yomutoki:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Yomutoki
        # Info.plist は構成ごとに INFOPLIST_FILE で渡す（ADR 0004、0005）。リソースとしてバンドルに写さない。
        excludes:
          - Info.plist
          - Info-Debug.plist
    entitlements:
      path: Yomutoki/Yomutoki.entitlements
      properties:
        com.apple.developer.default-data-protection: NSFileProtectionComplete
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.yomutoki
        PRODUCT_NAME: Yomutoki
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        # ADR 0002：アプリのターゲットの既定の actor 分離は MainActor（設定の名前は CI の出力で確かめる。設計メモ 10）。
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # iPhone は縦だけ（指揮役の決定）。Info.plist の UISupportedInterfaceOrientations と同じ値にする。
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES
      configs:
        Debug:
          INFOPLIST_FILE: Yomutoki/Info-Debug.plist
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          INFOPLIST_FILE: Yomutoki/Info.plist

  YomutokiTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: YomutokiTests
        excludes:
          - "*.xctestplan"
      # 計測のイベントと UITEST の seed の例を、契約のファイルのまま単体テストで読む（contracts/README.md の6）。
      - path: ../contracts/examples
        type: folder
        buildPhase: resources
      - path: ../contracts/seed.example.json
        buildPhase: resources
    dependencies:
      - target: Yomutoki
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.yomutoki.tests
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Yomutoki.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Yomutoki"
        BUNDLE_LOADER: "$(TEST_HOST)"

# スキーム Yomutoki は最上位に書き、verifier のファイルの同じ名前のスキームと合わさる（設計メモ 11 の 13）。
# ここには単体テストの計画だけを書く。既定の計画はこれ1つ。
schemes:
  Yomutoki:
    build:
      targets:
        Yomutoki: all
        YomutokiTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      testPlans:
        - path: YomutokiTests/Unit.xctestplan
          defaultPlan: true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
