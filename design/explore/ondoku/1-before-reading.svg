<text x="24.0" y="540.0" font-family="'Hiragino Sans', sans-serif" font-size="28" font-weight="700" fill="#1C1C1E" text-anchor="start">がめんを　したに　して</text>
<text x="24.0" y="578.0" font-family="'Hiragino Sans', sans-serif" font-size="28" font-weight="700" fill="#1C1C1E" text-anchor="start">おきましょう</text>
<text x="24.0" y="628.0" font-family="'Hiragino Sans', sans-serif" font-size="17" font-weight="400" fill="#1C1C1E" text-anchor="start">ふせると、ろくおんが　はじまります。</text>
<text x="24.0" y="654.0" font-family="'Hiragino Sans', sans-serif" font-size="17" font-weight="400" fill="#1C1C1E" text-anchor="start">よみおわったら、てに　とりましょう。</text>
<rect x="24.0" y="756.0" width="345.0" height="50.0" rx="12" fill="#F2F2F7"/>
<text x="196.5" y="787.0" font-family="'Hiragino Sans', sans-serif" font-size="17" font-weight="600" fill="#1C1C1E" text-anchor="middle">ふせずに　よむ</text>
<rect x="129.5" y="839.0" width="134.0" height="5.0" rx="2.5" fill="#000000"/>
</g>
