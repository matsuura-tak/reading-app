<text x="478.0" y="139.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#1C1C1E" text-anchor="start">この画面の仕事</text>
<text x="478.0" y="164.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="14" font-weight="400" fill="#1C1C1E" text-anchor="start">子どもが、画面を見ずに教科書を読み始められるようにする。主操作は、画面</text>
<text x="478.0" y="185.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="14" font-weight="400" fill="#1C1C1E" text-anchor="start">を下にして置くこと（ボタンではない）。</text>
<circle cx="489.0" cy="215.0" r="11.0" fill="#0066CC"/><text x="489.0" y="219.6" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="508.0" y="220.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="14" font-weight="400" fill="#1C1C1E" text-anchor="start">きのうの判：前の夜に親が押した判が、ここに出る。子どもは「聞いて</text>
<text x="508.0" y="241.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="14" font-weight="400" fill="#1C1C1E" text-anchor="start">もらえた」を次の日に知る。点数、星、連続日数は出さない。</text>
<circle cx="489.0" cy="266.0" r="11.0" fill="#0066CC"/><text x="489.0" y="270.6" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="508.0" y="271.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="14" font-weight="400" fill="#1C1C1E" text-anchor="start">図と大きな一文：教科書の横に、画面を下にして置く。字をまだ読めな</text>
<text x="508.0" y="292.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="14" font-weight="400" fill="#1C1C1E" text-anchor="start">い子にも図で伝わる。子どもの画面は、ひらがなと分かち書き（小学1年</text>
<text x="508.0" y="313.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="14" font-weight="400" fill="#1C1C1E" text-anchor="start">の国語の教科書と同じ、文節ごとに空ける書き方）。</text>
<circle cx="489.0" cy="338.0" r="11.0" fill="#0066CC"/><text x="489.0" y="342.6" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="508.0" y="343.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="14" font-weight="400" fill="#1C1C1E" text-anchor="start">伏せた瞬間に触覚が1回。画面は消え、録音が始まる。子どもは教科書だ</text>
<text x="508.0" y="364.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="14" font-weight="400" fill="#1C1C1E" text-anchor="start">けを見る。</text>
<circle cx="489.0" cy="389.0" r="11.0" fill="#0066CC"/><text x="489.0" y="393.6" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="508.0" y="394.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="14" font-weight="400" fill="#1C1C1E" text-anchor="start">手に取ると触覚が1回で、録音が終わる。画面には「よみおわりました」</text>
<text x="508.0" y="415.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="14" font-weight="400" fill="#1C1C1E" text-anchor="start">とだけ出る。読んだ長さも出さない。</text>
<circle cx="489.0" cy="440.0" r="11.0" fill="#0066CC"/><text x="489.0" y="444.6" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="508.0" y="445.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="14" font-weight="400" fill="#1C1C1E" text-anchor="start">ふせずに よむ：スタンドに立てる家や、伏せる動作がむずかしい子のた</text>
<text x="508.0" y="466.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="14" font-weight="400" fill="#1C1C1E" text-anchor="start">めの道。同じ録音が始まり、画面には「おわる」だけが出る。</text>
<text x="478.0" y="495.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="400" fill="#6E6E73" text-anchor="start">マイクの許可は、親が最初に設定するときに求める。子どもの画面では求めない。</text>
<text x="478.0" y="514.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="400" fill="#6E6E73" text-anchor="start">伏せている間は iOS の録音中の表示（橙の点）が見えないので、始まりは触覚</text>
<text x="478.0" y="533.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="400" fill="#6E6E73" text-anchor="start">と、子どもが自分で置いた動作で伝える［tech-lead に確かめる：伏せたことを</text>
<text x="478.0" y="552.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="400" fill="#6E6E73" text-anchor="start">録音の開始に使えるか］。</text>
<text x="478.0" y="778.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#1C1C1E" text-anchor="start">流れ（画面の外で起きること）</text>
