<text x="891.0" y="866.0" font-family="'Hiragino Sans', sans-serif" font-size="10" font-weight="700" fill="#1C1C1E" text-anchor="middle">よみおわり</text>
<text x="891.0" y="880.0" font-family="'Hiragino Sans', sans-serif" font-size="10" font-weight="700" fill="#1C1C1E" text-anchor="middle">ました</text>
<line x1="572.0" y1="878.0" x2="658.0" y2="878.0" stroke="#0066CC" stroke-width="1.5"/>
<path d="M 664.0 878.0 L 656.0 873.5 L 656.0 882.5 Z" fill="#0066CC"/>
<text x="618.0" y="854.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="700" fill="#0066CC" text-anchor="middle">伏せる</text>
<text x="618.0" y="870.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="400" fill="#0066CC" text-anchor="middle">触覚 1回</text>
<line x1="754.0" y1="878.0" x2="840.0" y2="878.0" stroke="#0066CC" stroke-width="1.5"/>
<path d="M 846.0 878.0 L 838.0 873.5 L 838.0 882.5 Z" fill="#0066CC"/>
<text x="800.0" y="854.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="700" fill="#0066CC" text-anchor="middle">手に取る</text>
<text x="800.0" y="870.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="400" fill="#0066CC" text-anchor="middle">触覚 1回</text>
<text x="527.0" y="968.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="12" font-weight="400" fill="#6E6E73" text-anchor="middle">この画面</text>
<text x="709.0" y="968.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="12" font-weight="400" fill="#6E6E73" text-anchor="middle">伏せている間（録音）</text>
<text x="891.0" y="968.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="12" font-weight="400" fill="#6E6E73" text-anchor="middle">手に取ったあと</text>
</svg>
