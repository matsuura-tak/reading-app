</g>
<text x="478.0" y="139.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#1C1C1E" text-anchor="start">この画面の仕事</text>
<text x="478.0" y="164.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="14" font-weight="400" fill="#1C1C1E" text-anchor="start">毎日の判と声を日ごとに残し、学年をまたいで聞き返せるようにする。主操作</text>
<text x="478.0" y="185.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="14" font-weight="400" fill="#1C1C1E" text-anchor="start">は、日の行を押して聞くこと。</text>
<circle cx="489.0" cy="215.0" r="11.0" fill="#0066CC"/><text x="489.0" y="219.6" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="508.0" y="220.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="14" font-weight="400" fill="#1C1C1E" text-anchor="start">親の画面。子どもには、次の日の始まりの画面（1枚目）に判だけを見せ</text>
<text x="508.0" y="241.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="14" font-weight="400" fill="#1C1C1E" text-anchor="start">る。長さの数字は子どもに見せない。</text>
<circle cx="489.0" cy="266.0" r="11.0" fill="#0066CC"/><text x="489.0" y="270.6" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="508.0" y="271.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="14" font-weight="400" fill="#1C1C1E" text-anchor="start">声の棚：学年ごとに1冊。終わった学年は黒い背の閉じた本、いまの学年</text>
<text x="508.0" y="292.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="14" font-weight="400" fill="#1C1C1E" text-anchor="start">は枠だけ。先の学年の空き枠は出さない（あと何年と数えさせない）。</text>
<text x="508.0" y="313.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="14" font-weight="400" fill="#1C1C1E" text-anchor="start">押すと、その学年の日ごとの欄が開く。</text>
<circle cx="489.0" cy="338.0" r="11.0" fill="#0066CC"/><text x="489.0" y="342.6" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="508.0" y="343.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="14" font-weight="400" fill="#1C1C1E" text-anchor="start">日ごとの欄（音読カードの代わり）：日付、時間帯、長さ、判。読んだ</text>
<text x="508.0" y="364.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="14" font-weight="400" fill="#1C1C1E" text-anchor="start">日だけが並び、読まなかった日を空欄として見せない（連続日数を作ら</text>
<text x="508.0" y="385.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="14" font-weight="400" fill="#1C1C1E" text-anchor="start">ない）。</text>
<circle cx="489.0" cy="410.0" r="11.0" fill="#0066CC"/><text x="489.0" y="414.6" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="508.0" y="415.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="14" font-weight="400" fill="#1C1C1E" text-anchor="start">まだ聞いていない日は、点線の丸と「まだ」。色ではなく、線の種類と</text>
<text x="508.0" y="436.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="14" font-weight="400" fill="#1C1C1E" text-anchor="start">文字で分ける。行を押すと、その日の声を聞く画面（2枚目）へ。</text>
<text x="478.0" y="465.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="400" fill="#6E6E73" text-anchor="start">学校に出す紙の音読カードは残る。紙へのサインとアプリの判が二重になる（この</text>
<text x="478.0" y="484.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="400" fill="#6E6E73" text-anchor="start">案のいちばん弱い所）。</text>
<text x="478.0" y="513.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="400" fill="#6E6E73" text-anchor="start">いちばん大きい文字（AX5）では、棚の横並びをやめて学年の行の一覧にする。行</text>
<text x="478.0" y="532.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="400" fill="#6E6E73" text-anchor="start">の中の日付と長さは縦に並べ、判は行の下に回す。</text>
</svg>
