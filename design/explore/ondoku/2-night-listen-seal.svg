</g>
<text x="478.0" y="139.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#1C1C1E" text-anchor="start">この画面の仕事</text>
<text x="478.0" y="164.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="14" font-weight="400" fill="#1C1C1E" text-anchor="start">その日の声を聞き、聞いたしるしの判を押す。主操作は判の長押し1つ。</text>
<circle cx="489.0" cy="194.0" r="11.0" fill="#0066CC"/><text x="489.0" y="198.6" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="508.0" y="199.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="14" font-weight="400" fill="#1C1C1E" text-anchor="start">再生：夕方の声を、手を止めて聞く。止めた所から続けられる。速さの</text>
<text x="508.0" y="220.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="14" font-weight="400" fill="#1C1C1E" text-anchor="start">切り替えや波形は置かない。</text>
<circle cx="489.0" cy="245.0" r="11.0" fill="#0066CC"/><text x="489.0" y="249.6" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="508.0" y="250.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="14" font-weight="400" fill="#1C1C1E" text-anchor="start">長押しの間（約0.6秒）、外の輪が満ちる。図は満ちる途中。指を離せば</text>
<text x="508.0" y="271.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="14" font-weight="400" fill="#1C1C1E" text-anchor="start">押されない。</text>
<circle cx="489.0" cy="296.0" r="11.0" fill="#0066CC"/><text x="489.0" y="300.6" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="508.0" y="301.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="14" font-weight="400" fill="#1C1C1E" text-anchor="start">満ちた瞬間に触覚が1回返り、判が点線から実線になって日付が入る（下</text>
<text x="508.0" y="322.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="14" font-weight="400" fill="#1C1C1E" text-anchor="start">の図）。音は鳴らさない。</text>
<circle cx="489.0" cy="347.0" r="11.0" fill="#0066CC"/><text x="489.0" y="351.6" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="508.0" y="352.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="14" font-weight="400" fill="#1C1C1E" text-anchor="start">押したあと5秒間は「取り消す」を出す（押し間違いの戻り道）。</text>
<circle cx="489.0" cy="377.0" r="11.0" fill="#0066CC"/><text x="489.0" y="381.6" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="508.0" y="382.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="14" font-weight="400" fill="#1C1C1E" text-anchor="start">判は朱の1色で、丸と日付の帯と文字だけで描く。朱肉のかすれ、にじ</text>
<text x="508.0" y="403.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="14" font-weight="400" fill="#1C1C1E" text-anchor="start">み、紙の質感はまねない。</text>
<text x="478.0" y="550.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="400" fill="#6E6E73" text-anchor="start">押したあと（触覚が1回返った直後）</text>
<rect x="478.0" y="560.0" width="240.0" height="256.0" rx="20" fill="#000000"/>
<circle cx="598.0" cy="664.0" r="72.0" fill="none" stroke="#FF6B4A" stroke-width="2.88"/><line x1="528.1" y1="646.7" x2="667.9" y2="646.7" stroke="#FF6B4A" stroke-width="2.304"/><line x1="528.1" y1="681.3" x2="667.9" y2="681.3" stroke="#FF6B4A" stroke-width="2.304"/><text x="598.0" y="627.1" font-family="'Hiragino Sans', sans-serif" font-size="21.6" font-weight="700" fill="#FF6B4A" text-anchor="middle">きいた</text><text x="598.0" y="671.6" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="21.6" font-weight="600" fill="#FF6B4A" text-anchor="middle">10.16</text><text x="598.0" y="715.1" font-family="'Hiragino Sans', sans-serif" font-size="18.0" font-weight="600" fill="#FF6B4A" text-anchor="middle">やまだ</text>
<text x="598.0" y="774.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">判を押しました</text>
<text x="598.0" y="798.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle" text-decoration="underline">取り消す</text>
<circle cx="740.0" cy="794.0" r="11.0" fill="#0066CC"/><text x="740.0" y="798.6" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="734.0" y="650.0" width="92.0" height="28.0" rx="14" fill="none" stroke="#0066CC" stroke-width="1.5"/>
<text x="780.0" y="669.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="700" fill="#0066CC" text-anchor="middle">触覚 1回</text>
<text x="478.0" y="844.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="400" fill="#6E6E73" text-anchor="start">VoiceOver：判は「判を押す」ボタン。長押しの代わりにダブルタップで押せる操</text>
<text x="478.0" y="863.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="400" fill="#6E6E73" text-anchor="start">作を用意し、押したら「10月16日、聞いた、の判を押しました」と読む。</text>
</svg>
