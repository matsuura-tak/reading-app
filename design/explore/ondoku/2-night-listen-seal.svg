<text x="24.0" y="150.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="start">そらの音読</text>
<text x="24.0" y="176.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="15" font-weight="400" fill="#98989F" text-anchor="start">夕方 16:55 から　3分12秒</text>
