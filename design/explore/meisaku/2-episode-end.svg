<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-labelledby="t d">
<title id="t">毎日の名作 2/3　回の終わり（そこで止まり、明日へ続く）</title>
<desc id="d">探りの案（仕様ではない）。iPhone 393×852pt、ライト。青い丸の番号は注記の印で、画面の一部ではない。</desc>
<rect x="0.0" y="0.0" width="1000.0" height="1000.0" rx="0" fill="#FFFFFF"/>
<text x="40.0" y="50.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="22" font-weight="700" fill="#1C1C1E" text-anchor="start">毎日の名作 2/3　回の終わり（そこで止まり、明日へ続く）</text>
<text x="40.0" y="80.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="400" fill="#6E6E73" text-anchor="start">探りの案（仕様ではない）。iPhone 393×852pt、ライト。青い丸の番号は注記の印で、画面の一部ではない。</text>
<g transform="translate(40,116)">
<clipPath id="scr"><rect x="0" y="0" width="393" height="852" rx="56"/></clipPath>
<g clip-path="url(#scr)">
<rect x="0.0" y="0.0" width="393.0" height="852.0" rx="0" fill="#FFFFFF"/>
<rect x="134.0" y="11.0" width="125.0" height="37.0" rx="18.5" fill="#000000"/>
<text x="72.0" y="37.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="17" font-weight="600" fill="#000000" text-anchor="middle">7:17</text>
<rect x="288.0" y="34.0" width="3.0" height="4.0" rx="1" fill="#000000"/>
<rect x="293.0" y="32.0" width="3.0" height="6.0" rx="1" fill="#000000"/>
<rect x="298.0" y="29.5" width="3.0" height="8.5" rx="1" fill="#000000"/>
<rect x="303.0" y="27.0" width="3.0" height="11.0" rx="1" fill="#000000"/>
<path d="M 318.8 35.3 A 4.5 4.5 0 0 1 325.2 35.3" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
<path d="M 316.2 32.7 A 8 8 0 0 1 327.8 32.7" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
<path d="M 313.7 30.2 A 11.5 11.5 0 0 1 330.3 30.2" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
<circle cx="322.0" cy="37.3" r="1.4" fill="#000000"/>
<rect x="336.0" y="27.0" width="25.0" height="12.0" rx="3.5" fill="none" stroke="#000000" stroke-width="1" stroke-opacity="0.4"/>
<rect x="338.0" y="29.0" width="19.0" height="8.0" rx="2" fill="#000000"/>
<rect x="362.0" y="31.0" width="1.6" height="4.0" rx="0.8" fill="#000000" fill-opacity="0.4"/>
<circle cx="40.0" cy="78.0" r="15.0" fill="#EEEEEF"/>
<line x1="34.5" y1="72.5" x2="45.5" y2="83.5" stroke="#3C3C43" stroke-width="2" stroke-linecap="round"/>
<line x1="45.5" y1="72.5" x2="34.5" y2="83.5" stroke="#3C3C43" stroke-width="2" stroke-linecap="round"/>
<text x="350.0" y="112.0" font-family="'Hiragino Mincho ProN', serif" font-size="17" font-weight="400" fill="#1C1C1E" style="writing-mode: vertical-rl">　宿は鎌倉でも辺鄙な方角にあ　た　玉突きだのアイスクリームだのというハイカ</text><text x="343.2" y="361.2" font-family="'Hiragino Mincho ProN', serif" font-size="17" font-weight="400" fill="#1C1C1E" text-anchor="start">っ</text><text x="350.9" y="389.6" font-family="'Hiragino Mincho ProN', serif" font-size="17" font-weight="400" fill="#1C1C1E" text-anchor="start">。</text>
<text x="363.2" y="235.2" font-family="'Hiragino Mincho ProN', serif" font-size="8.5" font-weight="400" fill="#1C1C1E" style="writing-mode: vertical-rl">へんぴ</text>
<text x="317.0" y="112.0" font-family="'Hiragino Mincho ProN', serif" font-size="17" font-weight="400" fill="#1C1C1E" style="writing-mode: vertical-rl">ラなものには長い畷を一つ越さなければ手が届かなか　た　車で行　ても二十銭は</text><text x="310.2" y="531.2" font-family="'Hiragino Mincho ProN', serif" font-size="17" font-weight="400" fill="#1C1C1E" text-anchor="start">っ</text><text x="317.9" y="559.6" font-family="'Hiragino Mincho ProN', serif" font-size="17" font-weight="400" fill="#1C1C1E" text-anchor="start">。</text><text x="310.2" y="633.2" font-family="'Hiragino Mincho ProN', serif" font-size="17" font-weight="400" fill="#1C1C1E" text-anchor="start">っ</text>
<text x="330.2" y="243.8" font-family="'Hiragino Mincho ProN', serif" font-size="8.5" font-weight="400" fill="#1C1C1E" style="writing-mode: vertical-rl">なわて</text>
<text x="284.0" y="112.0" font-family="'Hiragino Mincho ProN', serif" font-size="17" font-weight="400" fill="#1C1C1E" style="writing-mode: vertical-rl">取られた　けれども個人の別荘はそこここにいくつでも建てられていた　それに海</text><text x="284.9" y="185.6" font-family="'Hiragino Mincho ProN', serif" font-size="17" font-weight="400" fill="#1C1C1E" text-anchor="start">。</text><text x="284.9" y="661.6" font-family="'Hiragino Mincho ProN', serif" font-size="17" font-weight="400" fill="#1C1C1E" text-anchor="start">。</text>
<text x="251.0" y="112.0" font-family="'Hiragino Mincho ProN', serif" font-size="17" font-weight="400" fill="#1C1C1E" style="writing-mode: vertical-rl">へはごく近いので海水浴をやるには至極便利な地位を占めていた　</text><text x="251.8" y="610.6" font-family="'Hiragino Mincho ProN', serif" font-size="17" font-weight="400" fill="#1C1C1E" text-anchor="start">。</text>
<text x="218.0" y="656.0" font-family="'Hiragino Mincho ProN', serif" font-size="17" font-weight="400" fill="#1C1C1E" style="writing-mode: vertical-rl">（つづく）</text>
<text x="112.0" y="112.0" font-family="'Hiragino Sans', sans-serif" font-size="17" font-weight="700" fill="#1C1C1E" style="writing-mode: vertical-rl">今日の回は　ここまでです　</text><text x="112.8" y="202.6" font-family="'Hiragino Sans', sans-serif" font-size="17" font-weight="700" fill="#1C1C1E" text-anchor="start">、</text><text x="112.8" y="321.6" font-family="'Hiragino Sans', sans-serif" font-size="17" font-weight="700" fill="#1C1C1E" text-anchor="start">。</text>
<text x="80.0" y="112.0" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="400" fill="#6E6E73" style="writing-mode: vertical-rl">第二回は　明日の朝に届きます　</text><text x="80.8" y="176.9" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="400" fill="#6E6E73" text-anchor="start">、</text><text x="80.8" y="326.9" font-family="'Hiragino Sans', sans-serif" font-size="15" font-weight="400" fill="#6E6E73" text-anchor="start">。</text>
<text x="48.0" y="112.0" font-family="'Hiragino Sans', sans-serif" font-size="13" font-weight="400" fill="#6E6E73" style="writing-mode: vertical-rl">この回が新聞に載　た日　大正三年四月二十日</text><text x="42.8" y="224.6" font-family="'Hiragino Sans', sans-serif" font-size="13" font-weight="400" fill="#6E6E73" text-anchor="start">っ</text>
<rect x="24.0" y="770.0" width="345.0" height="50.0" rx="12" fill="#F2F2F7"/>
<text x="196.5" y="801.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="17" font-weight="600" fill="#1C1C1E" text-anchor="middle">閉じる</text>
<rect x="129.5" y="839.0" width="134.0" height="5.0" rx="2.5" fill="#000000"/>
</g>
<rect x="0.0" y="0.0" width="393.0" height="852.0" rx="56" fill="none" stroke="#C7C7CC" stroke-width="1.5"/>
<circle cx="218.0" cy="636.0" r="11.0" fill="#0066CC"/><text x="218.0" y="640.6" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<circle cx="96.0" cy="96.0" r="11.0" fill="#0066CC"/><text x="96.0" y="100.6" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<circle cx="48.0" cy="402.0" r="11.0" fill="#0066CC"/><text x="48.0" y="406.6" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<line x1="371.0" y1="795.0" x2="403.0" y2="795.0" stroke="#0066CC" stroke-width="1" stroke-dasharray="2 2"/><circle cx="371.0" cy="795.0" r="2.4" fill="#0066CC"/><circle cx="414.0" cy="795.0" r="11.0" fill="#0066CC"/><text x="414.0" y="799.6" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
</g>
<text x="478.0" y="139.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#1C1C1E" text-anchor="start">この画面の仕事</text>
<text x="478.0" y="164.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="14" font-weight="400" fill="#1C1C1E" text-anchor="start">今日の回が終わったことをはっきり示し、明日まで閉じてよいと伝える。主操</text>
<text x="478.0" y="185.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="14" font-weight="400" fill="#1C1C1E" text-anchor="start">作は「閉じる」1つ。</text>
<circle cx="489.0" cy="215.0" r="11.0" fill="#0066CC"/><text x="489.0" y="219.6" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="508.0" y="220.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="14" font-weight="400" fill="#1C1C1E" text-anchor="start">本文の最後に「（つづく）」。新聞の連載と同じ言葉で、回の終わりを</text>
<text x="508.0" y="241.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="14" font-weight="400" fill="#1C1C1E" text-anchor="start">示す。</text>
<circle cx="489.0" cy="266.0" r="11.0" fill="#0066CC"/><text x="489.0" y="270.6" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="508.0" y="271.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="14" font-weight="400" fill="#1C1C1E" text-anchor="start">アプリの言葉は、左の余白に縦に2行。作者の文（明朝体）と分けるた</text>
<text x="508.0" y="292.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="14" font-weight="400" fill="#1C1C1E" text-anchor="start">め、ゴシック体にする。</text>
<circle cx="489.0" cy="317.0" r="11.0" fill="#0066CC"/><text x="489.0" y="321.6" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="508.0" y="322.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="14" font-weight="400" fill="#1C1C1E" text-anchor="start">この回が新聞に載った日［確かめ中］。『こころ』は1914年4月20日か</text>
<text x="508.0" y="343.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="14" font-weight="400" fill="#1C1C1E" text-anchor="start">ら8月11日まで朝日新聞に連載された（検索の要約で確認。ページは開い</text>
<text x="508.0" y="364.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="14" font-weight="400" fill="#1C1C1E" text-anchor="start">ていない）。一が4月20日の回かは確かめていない。</text>
<circle cx="489.0" cy="389.0" r="11.0" fill="#0066CC"/><text x="489.0" y="393.6" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="508.0" y="394.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="14" font-weight="400" fill="#1C1C1E" text-anchor="start">「閉じる」だけを置く。「次の回へ」「おすすめ」「共有」「連続○日」</text>
<text x="508.0" y="415.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="14" font-weight="400" fill="#1C1C1E" text-anchor="start">は置かない。</text>
<text x="478.0" y="444.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="400" fill="#6E6E73" text-anchor="start">このページより先はない。左へめくっても端で止まる（システムの弾む動きだけ</text>
<text x="478.0" y="463.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="400" fill="#6E6E73" text-anchor="start">で、触覚や音は足さない）。</text>
<text x="478.0" y="492.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="400" fill="#6E6E73" text-anchor="start">次の回は、この回を読み終えた次の日に届く。読まない日があっても回はたまら</text>
<text x="478.0" y="511.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="400" fill="#6E6E73" text-anchor="start">ず、未読の数も見せない［推測。決めるのは pdm と Takuma］。</text>
<text x="478.0" y="540.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="400" fill="#6E6E73" text-anchor="start">本文は『こころ』上の一の終わりの段落（designer の記憶から。青空文庫とは照</text>
<text x="478.0" y="559.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="400" fill="#6E6E73" text-anchor="start">らし合わせていない）。</text>
</svg>
