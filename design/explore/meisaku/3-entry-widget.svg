<text x="478.0" y="139.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#1C1C1E" text-anchor="start">この画面の仕事</text>
<text x="478.0" y="164.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="14" font-weight="400" fill="#1C1C1E" text-anchor="start">今日の回が届いたことを、通知を送らずに知らせ、1タップでその回を開く。</text>
<circle cx="489.0" cy="194.0" r="11.0" fill="#0066CC"/><text x="489.0" y="198.6" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="508.0" y="199.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="14" font-weight="400" fill="#1C1C1E" text-anchor="start">ホーム画面のウィジェット（中）：作品名と、今日の回の書き出しを縦</text>
<text x="508.0" y="220.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="14" font-weight="400" fill="#1C1C1E" text-anchor="start">書きで。押すと、その回の最初のページが開く。</text>
<circle cx="489.0" cy="245.0" r="11.0" fill="#0066CC"/><text x="489.0" y="249.6" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="508.0" y="250.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="14" font-weight="400" fill="#1C1C1E" text-anchor="start">回の番号と、読む時間の目安。</text>
<text x="478.0" y="279.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="400" fill="#6E6E73" text-anchor="start">通知は初期値では送らない［決めるのは pdm と Takuma］。灰色の四角は、ほか</text>
<text x="478.0" y="298.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="400" fill="#6E6E73" text-anchor="start">のアプリの置き場所を示すだけ。作品の一覧の画面は、今回は描いていない。</text>
<circle cx="489.0" cy="405.0" r="11.0" fill="#0066CC"/><text x="489.0" y="409.6" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="508.0" y="410.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="400" fill="#1C1C1E" text-anchor="start">読み終えたあと：書き出しの代わりに2行だけ。先は見せない</text>
