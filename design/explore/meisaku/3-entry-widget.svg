<text x="747.0" y="454.0" font-family="'Hiragino Mincho ProN', serif" font-size="14" font-weight="400" fill="#6E6E73" style="writing-mode: vertical-rl">つづきは　明日　</text><text x="747.7" y="514.6" font-family="'Hiragino Mincho ProN', serif" font-size="14" font-weight="400" fill="#6E6E73" text-anchor="start">、</text><text x="747.7" y="556.6" font-family="'Hiragino Mincho ProN', serif" font-size="14" font-weight="400" fill="#6E6E73" text-anchor="start">。</text>
