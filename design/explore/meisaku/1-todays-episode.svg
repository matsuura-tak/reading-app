<line x1="45.5" y1="72.5" x2="34.5" y2="83.5" stroke="#3C3C43" stroke-width="2" stroke-linecap="round"/>
<text x="350.0" y="150.0" font-family="'Hiragino Mincho ProN', serif" font-size="19" font-weight="700" fill="#1C1C1E" style="writing-mode: vertical-rl">上　先生と私</text>
<text x="317.0" y="180.0" font-family="'Hiragino Mincho ProN', serif" font-size="17" font-weight="400" fill="#1C1C1E" style="writing-mode: vertical-rl">一</text>
<text x="284.0" y="112.0" font-family="'Hiragino Mincho ProN', serif" font-size="17" font-weight="400" fill="#1C1C1E" style="writing-mode: vertical-rl">　私はその人を常に先生と呼んでいた　だからここでもただ先生と書くだけで本名</text><text x="284.9" y="406.6" font-family="'Hiragino Mincho ProN', serif" font-size="17" font-weight="400" fill="#1C1C1E" text-anchor="start">。</text>
<text x="297.2" y="120.5" font-family="'Hiragino Mincho ProN', serif" font-size="8.5" font-weight="400" fill="#1C1C1E" style="writing-mode: vertical-rl">わたくし</text>
<text x="251.0" y="112.0" font-family="'Hiragino Mincho ProN', serif" font-size="17" font-weight="400" fill="#1C1C1E" style="writing-mode: vertical-rl">は打ち明けない　これは世間を憚かる遠慮というよりも　その方が私にと　て自然</text><text x="251.8" y="236.6" font-family="'Hiragino Mincho ProN', serif" font-size="17" font-weight="400" fill="#1C1C1E" text-anchor="start">。</text><text x="251.8" y="542.6" font-family="'Hiragino Mincho ProN', serif" font-size="17" font-weight="400" fill="#1C1C1E" text-anchor="start">、</text><text x="244.2" y="684.2" font-family="'Hiragino Mincho ProN', serif" font-size="17" font-weight="400" fill="#1C1C1E" text-anchor="start">っ</text>
<text x="264.2" y="350.0" font-family="'Hiragino Mincho ProN', serif" font-size="8.5" font-weight="400" fill="#1C1C1E" style="writing-mode: vertical-rl">はば</text>
<text x="218.0" y="112.0" font-family="'Hiragino Mincho ProN', serif" font-size="17" font-weight="400" fill="#1C1C1E" style="writing-mode: vertical-rl">だからである　私はその人の記憶を呼び起すごとに　すぐ「先生」といいたくなる　</text><text x="218.8" y="219.6" font-family="'Hiragino Mincho ProN', serif" font-size="17" font-weight="400" fill="#1C1C1E" text-anchor="start">。</text><text x="218.8" y="508.6" font-family="'Hiragino Mincho ProN', serif" font-size="17" font-weight="400" fill="#1C1C1E" text-anchor="start">、</text><text x="218.8" y="746.6" font-family="'Hiragino Mincho ProN', serif" font-size="17" font-weight="400" fill="#1C1C1E" text-anchor="start">。</text>
<text x="185.0" y="112.0" font-family="'Hiragino Mincho ProN', serif" font-size="17" font-weight="400" fill="#1C1C1E" style="writing-mode: vertical-rl">筆を執　ても心持は同じ事である　よそよそしい頭文字などはとても使う気になら</text><text x="178.2" y="174.2" font-family="'Hiragino Mincho ProN', serif" font-size="17" font-weight="400" fill="#1C1C1E" text-anchor="start">っ</text><text x="185.8" y="372.6" font-family="'Hiragino Mincho ProN', serif" font-size="17" font-weight="400" fill="#1C1C1E" text-anchor="start">。</text>
<text x="198.2" y="150.2" font-family="'Hiragino Mincho ProN', serif" font-size="8.5" font-weight="400" fill="#1C1C1E" style="writing-mode: vertical-rl">と</text>
<text x="198.2" y="490.2" font-family="'Hiragino Mincho ProN', serif" font-size="8.5" font-weight="400" fill="#1C1C1E" style="writing-mode: vertical-rl">かしらもじ</text>
<text x="152.0" y="112.0" font-family="'Hiragino Mincho ProN', serif" font-size="17" font-weight="400" fill="#1C1C1E" style="writing-mode: vertical-rl">ない　</text><text x="152.8" y="151.6" font-family="'Hiragino Mincho ProN', serif" font-size="17" font-weight="400" fill="#1C1C1E" text-anchor="start">。</text>
<text x="119.0" y="112.0" font-family="'Hiragino Mincho ProN', serif" font-size="17" font-weight="400" fill="#1C1C1E" style="writing-mode: vertical-rl">　私が先生と知り合いにな　たのは鎌倉である　その時私はまだ若々しい書生で</text><text x="112.2" y="327.2" font-family="'Hiragino Mincho ProN', serif" font-size="17" font-weight="400" fill="#1C1C1E" text-anchor="start">っ</text><text x="119.8" y="474.6" font-family="'Hiragino Mincho ProN', serif" font-size="17" font-weight="400" fill="#1C1C1E" text-anchor="start">。</text>
<text x="132.2" y="384.0" font-family="'Hiragino Mincho ProN', serif" font-size="8.5" font-weight="400" fill="#1C1C1E" style="writing-mode: vertical-rl">かまくら</text>
<text x="86.0" y="112.0" font-family="'Hiragino Mincho ProN', serif" font-size="17" font-weight="400" fill="#1C1C1E" style="writing-mode: vertical-rl">あ　た　暑中休暇を利用して海水浴に行　た友達からぜひ来いという端書を受け</text><text x="79.2" y="140.2" font-family="'Hiragino Mincho ProN', serif" font-size="17" font-weight="400" fill="#1C1C1E" text-anchor="start">っ</text><text x="86.8" y="168.6" font-family="'Hiragino Mincho ProN', serif" font-size="17" font-weight="400" fill="#1C1C1E" text-anchor="start">。</text><text x="79.2" y="429.2" font-family="'Hiragino Mincho ProN', serif" font-size="17" font-weight="400" fill="#1C1C1E" text-anchor="start">っ</text>
<text x="99.2" y="643.2" font-family="'Hiragino Mincho ProN', serif" font-size="8.5" font-weight="400" fill="#1C1C1E" style="writing-mode: vertical-rl">はがき</text>
<text x="53.0" y="112.0" font-family="'Hiragino Mincho ProN', serif" font-size="17" font-weight="400" fill="#1C1C1E" style="writing-mode: vertical-rl">取　たので　私は多少の金を工面して　出掛ける事にした　私は金の工面に二　</text><text x="46.2" y="140.2" font-family="'Hiragino Mincho ProN', serif" font-size="17" font-weight="400" fill="#1C1C1E" text-anchor="start">っ</text><text x="53.9" y="202.6" font-family="'Hiragino Mincho ProN', serif" font-size="17" font-weight="400" fill="#1C1C1E" text-anchor="start">、</text><text x="53.9" y="406.6" font-family="'Hiragino Mincho ProN', serif" font-size="17" font-weight="400" fill="#1C1C1E" text-anchor="start">、</text><text x="53.9" y="559.6" font-family="'Hiragino Mincho ProN', serif" font-size="17" font-weight="400" fill="#1C1C1E" text-anchor="start">。</text><text x="53.9" y="712.6" font-family="'Hiragino Mincho ProN', serif" font-size="17" font-weight="400" fill="#1C1C1E" text-anchor="start">、</text>
<text x="66.2" y="337.2" font-family="'Hiragino Mincho ProN', serif" font-size="8.5" font-weight="400" fill="#1C1C1E" style="writing-mode: vertical-rl">くめん</text>
<text x="66.2" y="694.2" font-family="'Hiragino Mincho ProN', serif" font-size="8.5" font-weight="400" fill="#1C1C1E" style="writing-mode: vertical-rl">に</text>
<rect x="24.0" y="772.0" width="345.0" height="2.0" rx="1" fill="#E5E5EA"/>
<rect x="300.0" y="772.0" width="69.0" height="2.0" rx="1" fill="#1C1C1E"/>
<text x="196.5" y="800.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="400" fill="#6E6E73" text-anchor="middle">1 / 5</text>
<rect x="129.5" y="839.0" width="134.0" height="5.0" rx="2.5" fill="#000000"/>
</g>
<rect x="0.0" y="0.0" width="393.0" height="852.0" rx="56" fill="none" stroke="#C7C7CC" stroke-width="1.5"/>
