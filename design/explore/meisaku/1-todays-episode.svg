<line x1="362.0" y1="200.0" x2="403.0" y2="200.0" stroke="#0066CC" stroke-width="1" stroke-dasharray="2 2"/><circle cx="362.0" cy="200.0" r="2.4" fill="#0066CC"/><circle cx="414.0" cy="200.0" r="11.0" fill="#0066CC"/><text x="414.0" y="204.6" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<line x1="296.0" y1="420.0" x2="403.0" y2="420.0" stroke="#0066CC" stroke-width="1" stroke-dasharray="2 2"/><circle cx="296.0" cy="420.0" r="2.4" fill="#0066CC"/><circle cx="414.0" cy="420.0" r="11.0" fill="#0066CC"/><text x="414.0" y="424.6" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<line x1="303.0" y1="137.0" x2="403.0" y2="137.0" stroke="#0066CC" stroke-width="1" stroke-dasharray="2 2"/><circle cx="303.0" cy="137.0" r="2.4" fill="#0066CC"/><circle cx="414.0" cy="137.0" r="11.0" fill="#0066CC"/><text x="414.0" y="141.6" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<line x1="371.0" y1="773.0" x2="403.0" y2="773.0" stroke="#0066CC" stroke-width="1" stroke-dasharray="2 2"/><circle cx="371.0" cy="773.0" r="2.4" fill="#0066CC"/><circle cx="414.0" cy="773.0" r="11.0" fill="#0066CC"/><text x="414.0" y="777.6" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
</g>
<text x="478.0" y="139.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="15" font-weight="700" fill="#1C1C1E" text-anchor="start">この画面の仕事</text>
<text x="478.0" y="164.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="14" font-weight="400" fill="#1C1C1E" text-anchor="start">今日の回を、縦書きで、約5分で読み切る。主操作は、ページを左へめくって</text>
<text x="478.0" y="185.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="14" font-weight="400" fill="#1C1C1E" text-anchor="start">読むこと。</text>
<circle cx="489.0" cy="215.0" r="11.0" fill="#0066CC"/><text x="489.0" y="219.6" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="508.0" y="220.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="14" font-weight="400" fill="#1C1C1E" text-anchor="start">画面にあるのは「閉じる」と本文だけ。文字の大きさは端末の設定</text>
<text x="508.0" y="241.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="14" font-weight="400" fill="#1C1C1E" text-anchor="start">（Dynamic Type）に従い、アプリの中に設定を置かない。</text>
<circle cx="489.0" cy="266.0" r="11.0" fill="#0066CC"/><text x="489.0" y="270.6" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="508.0" y="271.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="14" font-weight="400" fill="#1C1C1E" text-anchor="start">見出し「上　先生と私」と回の番号「一」。新聞の連載の回を、そのま</text>
<text x="508.0" y="292.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="14" font-weight="400" fill="#1C1C1E" text-anchor="start">ま1日の回にする案［回と章の対応は確かめ中］。</text>
<circle cx="489.0" cy="317.0" r="11.0" fill="#0066CC"/><text x="489.0" y="321.6" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="508.0" y="322.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="14" font-weight="400" fill="#1C1C1E" text-anchor="start">本文はヒラギノ明朝。行は右から左へ。ページは左へめくる（紙の本と</text>
<text x="508.0" y="343.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="14" font-weight="400" fill="#1C1C1E" text-anchor="start">同じ向き）。句読点は行の終わりにぶら下げる。</text>
<circle cx="489.0" cy="368.0" r="11.0" fill="#0066CC"/><text x="489.0" y="372.6" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="508.0" y="373.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="14" font-weight="400" fill="#1C1C1E" text-anchor="start">ルビは本文の右に、本文の半分の大きさで付ける（例：私《わたく</text>
<text x="508.0" y="394.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="14" font-weight="400" fill="#1C1C1E" text-anchor="start">し》、鎌倉《かまくら》）。</text>
<circle cx="489.0" cy="419.0" r="11.0" fill="#0066CC"/><text x="489.0" y="423.6" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="508.0" y="424.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="14" font-weight="400" fill="#1C1C1E" text-anchor="start">下の線は右から左へ伸びる。「1 / 5」は、この回の中のページ。作品</text>
<text x="508.0" y="445.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="14" font-weight="400" fill="#1C1C1E" text-anchor="start">全体の進み具合や、残りの日数は出さない。</text>
<text x="478.0" y="474.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="400" fill="#6E6E73" text-anchor="start">本文は夏目漱石『こころ』の冒頭（著作権の切れた作品）。designer が覚えてい</text>
<text x="478.0" y="493.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="400" fill="#6E6E73" text-anchor="start">る文から写したもので、青空文庫の本文とは照らし合わせていない。ルビの位置も </text>
<text x="478.0" y="512.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="400" fill="#6E6E73" text-anchor="start">designer が選んだ。</text>
<text x="478.0" y="541.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="400" fill="#6E6E73" text-anchor="start">いちばん大きい文字（AX5）では、1ページの字数が減り、ページが増える（回の分</text>
<text x="478.0" y="560.0" font-family="-apple-system, 'Hiragino Sans', sans-serif" font-size="13" font-weight="400" fill="#6E6E73" text-anchor="start">量は変えない）。縦書きのまま保つか、横書きに切り替えるかは未決。</text>
</svg>
